; References (full entries: docs/references.md at the repository root):
;   [R63] ESP32 TRM / Arduino-ESP32 / PlatformIO: PlatformIO, espressif32
;   [R14] micro-ROS / micro_ros_arduino: micro_ros_arduino
; More details: firmware/README.md

[platformio]
; Plain `pio run` / `pio run -t upload` (no -e flag) only build the main
; firmware. Use `pio run -e teleop_wheels_test -t upload` for the test one.
default_envs = esp32dev

[env:esp32dev]
; ESP32 firmware for the DDSM Driver HAT controller.
platform = espressif32
board = esp32dev
framework = arduino

; Match the Raspberry Pi micro-ROS agent baudrate for the USB serial link.
monitor_speed = 921600
; A lower upload rate is more reliable for ESP32 bootloader recovery.
upload_speed = 460800

; Both firmware entry points live in src/ (PlatformIO doesn't support a
; per-environment src_dir); this excludes the other environment's main file
; so only one setup()/loop() pair is ever compiled at a time.
build_src_filter = +<*> -<teleop_wheels_test_main.cpp>

lib_deps =
    ; Jazzy-compatible Arduino micro-ROS library.
    https://github.com/micro-ROS/micro_ros_arduino.git#v2.0.8-jazzy

build_flags =
    ; Link the prebuilt micro-ROS static library shipped by micro_ros_arduino.
    -L.pio/libdeps/esp32dev/micro_ros_arduino/src/esp32
    -lmicroros
    ; Robot hardware/calibration values copied into RobotConfig.h.
    -D ROS_SERIAL_BAUD=921600
    -D DDSM_RX_PIN=18
    -D DDSM_TX_PIN=19
    -D DDSM_BAUD=115200
    -D DDSM_MOTOR_TYPE=210
    -D DDSM_TX_ENABLE_PIN=4
    ; Prototype B is the teaching and mapping platform (188 mm wide overall,
    ; within the TrackBotGP limit); it is not entered in competition.
    -D MOTOR_COUNT=2
    ; DDSM210 wheel is 74.5 mm across (Waveshare drawing): 37.25 mm nominal.
    ; The old 57.5 mm made odometry read 1.57x the true distance and every
    ; speed command 36% slow. Straight-line test 2026-09-28: real/odometry
    ; 0.6371 over 3 x 2 m -> effective radius 36.63 mm (tyre compression);
    ; after flashing, 2 x 2 m (0.997) and 5 x 1 m (1.006) runs -> 36.74 mm.
    ; Track: the configured 0.235 m made every 90 deg odometry turn ~112 deg
    ; real. LiDAR-measured in-place rotation (calibrate_odometry mode:=rotate,
    ; 2 turns each way): 0.1828 / 0.1836 m -> 0.1832 m; re-measured with that
    ; flashed: 0.1791 (anticlockwise) / 0.1751 (clockwise) -> 0.1771 m. The
    ; UMBmark square disagreed (wanted 0.1914): both directions ended behind
    ; the start, i.e. caster drag translating the robot during in-place turns,
    ; which UMBmark misreads as wheelbase error. The LiDAR heading is used.
    ; A third run with 0.1771 flashed gave 0.1844: single runs scatter +/-2%
    ; (LiDAR match 6-29 cm), so the mean of all three, 0.1816 m, is used.
    -D WHEEL_RADIUS_M=0.03674f
    -D TRACK_WIDTH_M=0.1816f
    ; Motor ID 1 is the physical RIGHT wheel and ID 2 the LEFT (verified
    ; 2026-09-27: with 1 as left, the robot turned opposite to the command and
    ; /odom reported yaw with the wrong sign). Each motor keeps its own sign.
    -D LEFT_FRONT_ID=2
    -D RIGHT_FRONT_ID=1
    -D LEFT_MOTOR_SIGN=1
    -D RIGHT_MOTOR_SIGN=-1
    ; Odometry is computed once per 40 ms control step. A 50 ms publish period
    ; only fires on every second step (12.5 Hz); 40 ms publishes each step.
    -D ODOM_PUBLISH_PERIOD_MS=40
    ; Normal firmware remains stopped until /cmd_vel arrives.
    ; Set to 1 only for the deliberate autonomous bench wheel test.
    -D STARTUP_WHEEL_TEST=0

[env:teleop_wheels_test]
; Minimal parallel firmware (src/teleop_wheels_test_main.cpp) that only
; subscribes to /cmd_vel and drives the DDSM wheels - no odometry, no time
; sync, no reconnect state machine, no startup wheel test. Isolates the
; teleop -> ESP32 -> DDSM path from the rest of RobotApp's complexity.
; Build/upload: pio run -e teleop_wheels_test -t upload
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<teleop_wheels_test_main.cpp> -<main.cpp>

monitor_speed = 921600
upload_speed = 460800

lib_deps =
    https://github.com/micro-ROS/micro_ros_arduino.git#v2.0.8-jazzy

build_flags =
    -L.pio/libdeps/teleop_wheels_test/micro_ros_arduino/src/esp32
    -lmicroros
    -D ROS_SERIAL_BAUD=921600
    -D DDSM_RX_PIN=18
    -D DDSM_TX_PIN=19
    -D DDSM_BAUD=115200
    -D DDSM_MOTOR_TYPE=210
    -D DDSM_TX_ENABLE_PIN=4
    ; Prototype B is the teaching and mapping platform (188 mm wide overall,
    ; within the TrackBotGP limit); it is not entered in competition.
    -D MOTOR_COUNT=2
    ; DDSM210 wheel is 74.5 mm across (Waveshare drawing): 37.25 mm nominal.
    ; The old 57.5 mm made odometry read 1.57x the true distance and every
    ; speed command 36% slow. Straight-line test 2026-09-28: real/odometry
    ; 0.6371 over 3 x 2 m -> effective radius 36.63 mm (tyre compression);
    ; after flashing, 2 x 2 m (0.997) and 5 x 1 m (1.006) runs -> 36.74 mm.
    ; Track: the configured 0.235 m made every 90 deg odometry turn ~112 deg
    ; real. LiDAR-measured in-place rotation (calibrate_odometry mode:=rotate,
    ; 2 turns each way): 0.1828 / 0.1836 m -> 0.1832 m; re-measured with that
    ; flashed: 0.1791 (anticlockwise) / 0.1751 (clockwise) -> 0.1771 m. The
    ; UMBmark square disagreed (wanted 0.1914): both directions ended behind
    ; the start, i.e. caster drag translating the robot during in-place turns,
    ; which UMBmark misreads as wheelbase error. The LiDAR heading is used.
    ; A third run with 0.1771 flashed gave 0.1844: single runs scatter +/-2%
    ; (LiDAR match 6-29 cm), so the mean of all three, 0.1816 m, is used.
    -D WHEEL_RADIUS_M=0.03674f
    -D TRACK_WIDTH_M=0.1816f
    ; Motor ID 1 is the physical RIGHT wheel and ID 2 the LEFT (verified
    ; 2026-09-27: with 1 as left, the robot turned opposite to the command and
    ; /odom reported yaw with the wrong sign). Each motor keeps its own sign.
    -D LEFT_FRONT_ID=2
    -D RIGHT_FRONT_ID=1
    -D LEFT_MOTOR_SIGN=1
    -D RIGHT_MOTOR_SIGN=-1
